# One package: the settings navigation collapse plugin. Install it into a dsh
# profile (`dsh plugin add @mengli114/dsh-settings-nav-collapse`) — the patch
# layer below inserts the single plugin row that mounts BOTH halves: the host
# side (an empty apply()) and the browser side (the modules node half scans
# `dsh.client` packages into the web plugin roster, served from this package's
# client.js).

- insert:
    - id: settings-nav-collapse
      name: '@mengli114/dsh-settings-nav-collapse'
